<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>管理画面 | Green Room</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>

<body>

<header class="header">

    <div class="logo">
        🌿 Green Room
    </div>

    <nav>

        <a href="index.html">
            ホーム
        </a>

        <a href="soudan.html">
            相談ページ
        </a>

        <button
            id="logoutButton"
            class="secondary-button"
            type="button">
            ログアウト
        </button>

    </nav>

</header>


<main class="chat-page">

    <div class="chat-header">

        <p class="section-label">
            ADMIN
        </p>

        <h1>
            相談管理
        </h1>

        <p>
            相談者との相談履歴を確認できます。
        </p>

    </div>


    <!-- =========================
         相談履歴
    ========================== -->

    <section
        id="historyArea"
        class="chat-box">

        <h2>
            📋 相談履歴
        </h2>

        <p class="history-description">
            これまでの相談を選んでください。
        </p>

        <div
            id="consultationList"
            class="consultation-list">

            相談履歴を読み込んでいます...

        </div>

    </section>


    <!-- =========================
         トーク画面
    ========================== -->

    <section
        id="adminChatArea"
        class="chat-area"
        style="display:none;">

        <div class="chat-room-header">

            <button
                id="backButton"
                type="button"
                class="back-button">

                ← 履歴に戻る

            </button>

            <div class="chat-room-title">

                <strong id="chatTitle">
                    🌿 Green Room
                </strong>

                <span>
                    相談者とのトーク
                </span>

            </div>

        </div>


        <!-- トーク履歴 -->

        <div
            id="adminMessages"
            class="messages">

        </div>


        <!-- 管理者返信 -->

        <div class="chat-input">

            <textarea
                id="adminChatMessage"
                placeholder="返信を入力..."
                rows="1"></textarea>

            <button
                id="sendAdminMessageButton"
                type="button">

                送信

            </button>

        </div>

    </section>

</main>


<footer>

    <p>
        © Green Room
    </p>

</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="kanri.js"></script>

</body>

</html>
