<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <title>VAPIDキー作成</title>

</head>

<body>

<h1>通知用キーを作成</h1>

<button id="generateButton">
    キーを作成する
</button>

<h2>公開キー</h2>

<textarea
    id="publicKey"
    rows="4"
    cols="80">
</textarea>

<h2>秘密キー</h2>

<textarea
    id="privateKey"
    rows="4"
    cols="80">
</textarea>

<p>
    ※秘密キーは他人に見せないでください。
</p>


<script>

function base64UrlToBytes(base64url) {

    const padding =
        "=".repeat(
            (4 - base64url.length % 4) % 4
        );

    const base64 =
        (base64url + padding)
            .replace(/-/g, "+")
            .replace(/_/g, "/");

    const raw =
        atob(base64);

    return Uint8Array.from(
        raw,
        function (char) {
            return char.charCodeAt(0);
        }
    );
}


function bytesToBase64Url(bytes) {

    let binary = "";

    bytes.forEach(
        function (byte) {
            binary += String.fromCharCode(byte);
        }
    );

    return btoa(binary)
        .replace(/\+/g, "-")
        .replace(/\//g, "_")
        .replace(/=+$/, "");
}


document
    .getElementById("generateButton")
    .addEventListener(
        "click",
        async function () {

            const keyPair =
                await crypto.subtle.generateKey(
                    {
                        name: "ECDSA",
                        namedCurve: "P-256"
                    },
                    true,
                    [
                        "sign",
                        "verify"
                    ]
                );


            const publicJwk =
                await crypto.subtle.exportKey(
                    "jwk",
                    keyPair.publicKey
                );


            const privateJwk =
                await crypto.subtle.exportKey(
                    "jwk",
                    keyPair.privateKey
                );


            const x =
                base64UrlToBytes(
                    publicJwk.x
                );

            const y =
                base64UrlToBytes(
                    publicJwk.y
                );


            const publicBytes =
                new Uint8Array([
                    4,
                    ...x,
                    ...y
                ]);


            const publicKey =
                bytesToBase64Url(
                    publicBytes
                );


            const privateKey =
                privateJwk.d;


            document
                .getElementById("publicKey")
                .value =
                publicKey;


            document
                .getElementById("privateKey")
                .value =
                privateKey;


            alert(
                "キーを作成しました！"
            );

        }
    );

</script>

</body>

</html>
