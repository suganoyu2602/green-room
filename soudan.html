<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>相談 | Green Room</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>

<body>

<header class="header">

    <div class="logo">
        🌿 Green Room
    </div>

    <nav>

        <a href="index.html">
            ホーム
        </a>

        <button
            id="logoutButton"
            class="secondary-button"
            type="button">
            ログアウト
        </button>

    </nav>

</header>


<main class="chat-page">

    <div class="chat-header">

        <p class="section-label">
            GREEN ROOM
        </p>

        <h1>
            あなたの相談
        </h1>

        <p>
            管理者とゆっくりお話しできます。
        </p>

    </div>


    <!-- 新しい相談 -->

    <div
        id="newConsultation"
        class="chat-box">

        <h2>
            新しく相談する
        </h2>

        <div class="input-area">

            <input
                type="text"
                id="nickname"
                placeholder="ニックネーム">

            <textarea
                id="message"
                placeholder="相談内容を書いてください..."
            ></textarea>

            <button
                id="sendButton">

                相談を始める

            </button>

        </div>

        <p
            id="sendMessage"
            class="status-message">
        </p>

    </div>


    <!-- 相談一覧 -->

    <div
        id="consultationList"
        class="consultation-list">

        相談を読み込んでいます...

    </div>


    <!-- トーク画面 -->

    <div
        id="chatArea"
        class="chat-area"
        style="display:none;">

        <div class="chat-room-header">

            <button
                id="backButton"
                type="button"
                class="back-button">

                ← 戻る

            </button>

            <div>

                <strong>
                    🌿 Green Room
                </strong>

                <span>
                    管理者との相談
                </span>

            </div>

        </div>


        <div
            id="messages"
            class="messages">
        </div>


        <div class="chat-input">

            <textarea
                id="chatMessage"
                placeholder="メッセージを入力..."
                rows="1"></textarea>

            <button
                id="sendChatButton"
                type="button">

                送信

            </button>

        </div>

    </div>

</main>


<footer>

    <p>
        © Green Room
    </p>

</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="soudan.js"></script>

</body>

</html>
