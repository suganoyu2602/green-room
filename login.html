<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>ログイン | Green Room</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">

    <div class="logo">
        🌿 Green Room
    </div>

    <nav>
        <a href="index.html">ホーム</a>
    </nav>

</header>


<main class="chat-page">

    <div class="chat-header">

        <p class="section-label">
            LOGIN
        </p>

        <h1>
            Green Roomにログイン
        </h1>

        <p>
            ログインすると<br>
            自分の相談と返信を確認できます。
        </p>

    </div>


    <div class="chat-box login-box">

        <div class="input-area">

            <input
                type="email"
                id="email"
                placeholder="メールアドレス">

            <input
                type="password"
                id="password"
                placeholder="パスワード">

            <button id="loginButton">
                ログイン
            </button>

            <button
                id="signupButton"
                class="secondary-button">

                新規登録

            </button>

        </div>

        <p
            id="loginMessage"
            class="status-message">
        </p>

    </div>

</main>


<footer>
    <p>© Green Room</p>
</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="login.js"></script>

</body>

</html>
